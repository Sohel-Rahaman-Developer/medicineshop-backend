# /etc/nginx/sites-available/medbox24 — ln -s to sites-enabled, nginx -t, reload, then
# certbot --nginx -d medbox24.in -d www.medbox24.in -d api.medbox24.in -d admin.medbox24.in
# The apps listen on 127.0.0.1 only; Nginx is the one door.

server {
  listen 80;
  listen [::]:80;
  server_name api.medbox24.in;

  # Invoice / damage photos come as data URLs up to ~850 KB (the API refuses more)
  client_max_body_size 1m;
  gzip on;
  gzip_proxied any;
  gzip_types application/json text/csv;

  # D78: a scan or a phone photo for AI reading (the API refuses more than ~4 MB); Claude may take a minute or two.
  location = /api/v1/purchases/import/ai {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:5300;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (always this block's server_name)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:5300;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (always this block's server_name)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# The public site and the shop app share one address.
server {
  listen 80;
  listen [::]:80;
  server_name medbox24.in;

  location / {
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (always this block's server_name)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# One address for search engines: www goes to the bare domain.
server {
  listen 80;
  listen [::]:80;
  server_name www.medbox24.in;
  return 301 https://medbox24.in$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.medbox24.in;

  location / {
    proxy_pass http://127.0.0.1:3301;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (always this block's server_name)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
