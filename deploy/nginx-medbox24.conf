# /etc/nginx/sites-available/medbox24 — ln -s to sites-enabled, nginx -t, reload, then
# certbot --nginx -d medbox24.in -d www.medbox24.in -d api.medbox24.in -d admin.medbox24.in
# The apps listen on 127.0.0.1 only; Nginx is the one door.

server {
  listen 80;
  listen [::]:80;
  server_name api.medbox24.in;

  # Invoice / damage photos come as data URLs up to ~850 KB (the API refuses more)
  client_max_body_size 1m;
  gzip on;
  gzip_proxied any;
  gzip_types application/json text/csv;

  # D78: a scan or a phone photo for AI reading (the API refuses more than ~4 MB); Claude may take a minute or two.
  location = /api/v1/purchases/import/ai {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:5300;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (always this block's server_name)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://127.0.0.1:5300;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (always this block's server_name)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# The public site and the shop app share one address.
server {
  listen 80;
  listen [::]:80;
  server_name medbox24.in;

  location / {
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (always this block's server_name)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# One address for search engines: www goes to the bare domain.
server {
  listen 80;
  listen [::]:80;
  server_name www.medbox24.in;
  # The redirect carries HSTS too (certbot copies this into the 443 block).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  return 301 https://medbox24.in$request_uri;
}

# D94: a shop's own address, <name>.medbox24.in, is the shop app; the app checks the name and sends unknown or paused ones
# to medbox24.in/login. The names above (api, www, admin) are exact and always win over this wildcard. The wildcard
# certificate comes from a DNS check (certbot certonly --manual --preferred-challenges dns --cert-name wild.medbox24.in
# -d '*.medbox24.in'), so certbot --nginx can't add the 443 block — it is written out here.
server {
  listen 80;
  listen [::]:80;
  server_name *.medbox24.in;
  return 301 https://$host$request_uri; # nosemgrep: request-host-used (only *.medbox24.in reaches this block)
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name *.medbox24.in;
  ssl_certificate /etc/letsencrypt/live/wild.medbox24.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wild.medbox24.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  location / {
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (the app reads the shop's name from it and checks it)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name admin.medbox24.in;

  location / {
    proxy_pass http://127.0.0.1:3301;
    proxy_http_version 1.1;
    proxy_set_header Host $host; # nosemgrep: request-host-used (always this block's server_name)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
