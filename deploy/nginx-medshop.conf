# /etc/nginx/sites-available/pharma — ln -s to sites-enabled, nginx -t, reload, then certbot --nginx -d med.trackcloud.in -d medadmin.trackcloud.in -d medapi.trackcloud.in
# The apps listen on 127.0.0.1 only; Nginx is the one door.

map $http_upgrade $pharma_conn_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name medapi.trackcloud.in;

  # Invoice / damage photos come as data URLs up to ~850 KB (the API refuses more)
  client_max_body_size 1m;
  gzip on;
  gzip_proxied any;
  gzip_types application/json text/csv;

  location / {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name med.trackcloud.in;

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pharma_conn_upgrade;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name medadmin.trackcloud.in;

  location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pharma_conn_upgrade;
  }
}
